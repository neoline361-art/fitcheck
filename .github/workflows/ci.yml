name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Keep all versions running so one failure doesn't cancel others
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Upgrade setuptools
        run: pip install "setuptools>=83.0.0"  # PYSEC-2026-3447
      - name: Lint with ruff
        run: ruff check fitcheck/
      - name: Type check with mypy
        run: mypy fitcheck/
      - name: Security scan with bandit
        run: bandit -r fitcheck/ -x tests
      - name: Audit dependencies
        run: pip-audit
      - name: Test with pytest
        run: pytest --cov=fitcheck --cov-report=term-missing
      - name: Coverage badge
        run: |
          coverage=$(python -c "import json; print(json.load(open('htmlcov/status.json'))['note'])")
          echo "coverage=$coverage" >> $GITHUB_OUTPUT
        id: cov

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Run demo
        run: fitcheck demo
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: "*.html"
