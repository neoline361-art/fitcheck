name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write  # Sigstore signing + trusted PyPI publishing
  contents: write  # GitHub release attachments

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from lock file
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip install build twine
      - name: Verify version matches tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -c "import fitcheck, os; tag = os.environ['REF_NAME'].removeprefix('v'); assert fitcheck.__version__ == tag, (fitcheck.__version__, tag)"
      - name: Build package
        run: python -m build
      - name: Publish to PyPI (trusted publishing)
        # Requires a PyPI "trusted publisher" environment configured in repo settings.
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --outfile sbom.json
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./dist/*
            ./sbom.json
