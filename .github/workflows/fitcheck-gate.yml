name: FitCheck Gate

on:
  pull_request:
    paths:
      - "**/*.csv"
      - "**/*.parquet"
      - "data/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FitCheck
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Find changed data files
        id: files
        run: |
          files=$(git diff --name-only --diff-filter=ACM ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(csv|parquet)$' || true)
          echo "changed=$files" >> $GITHUB_OUTPUT
      - name: Run FitCheck on changed files
        if: steps.files.outputs.changed != ''
        id: check
        run: |
          python << 'EOF'
          import os, sys, json
          from fitcheck import check
          files = os.environ.get("CHANGED_FILES", "").split()
          reports = []
          for f in files:
              if not os.path.exists(f):
                  continue
              try:
                  result = check(f, return_format="dict")
                  reports.append({"file": f, **result})
              except Exception as e:
                  reports.append({"file": f, "error": str(e), "passed": False})
          with open("fitcheck_results.json", "w") as out:
              json.dump(reports, out, indent=2, default=str)
          EOF
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed }}
      - name: Comment on PR
        if: steps.files.outputs.changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = [];
            try {
              results = JSON.parse(fs.readFileSync('fitcheck_results.json', 'utf8'));
            } catch(e) { return; }
            const lines = results.map(r => {
              const status = r.passed ? 'PASS' : 'ISSUES';
              const icon = r.passed ? 'PASS' : 'WARN';
              return `- **${r.file}**: ${icon} | ${r.total_rows||'?'} rows, ${r.total_columns||'?'} cols | Issues: ${r.summary?.critical||0} critical, ${r.summary?.warning||0} warning`;
            });
            const body = `## FitCheck Data Validation\n\n${lines.join('\n')}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      - name: Upload fix scripts
        if: steps.files.outputs.changed != ''
        uses: actions/upload-artifact@v7
        with:
          name: fitcheck-fix-scripts
          path: "*_fix_script.py"
