name: Feature Request
description: Suggest an idea for FitCheck
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check existing issues and ROADMAP.md first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
