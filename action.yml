name: 'FitCheck'
description: 'ML data validation preflight check — blocks PRs on BLOCK verdict'
inputs:
  command:
    description: 'FitCheck CLI command (e.g. "check data.csv --mode decision")'
    required: true
    default: 'check data.csv --mode decision'
  fail-on:
    description: 'Minimum severity to fail (info/warning/critical)'
    required: false
    default: 'warning'
  policy:
    description: 'Path to fitcheck.yaml policy file'
    required: false
    default: ''
  secret-key:
    description: 'HMAC-SHA256 secret key for report signing'
    required: false
    default: ''
outputs:
  verdict:
    description: 'Decision verdict (PASS/WARN/BLOCK) when using --mode decision'
    value: ${{ steps.fitcheck.outputs.verdict }}
  exit-code:
    description: 'FitCheck exit code'
    value: ${{ steps.fitcheck.outputs.exit-code }}
runs:
  using: 'composite'
  steps:
    - name: Install FitCheck
      run: pip install data-fitcheck
      shell: bash
    - name: Run FitCheck
      id: fitcheck
      run: |
        POLICY_FLAG=""
        if [ -n "${{ inputs.policy }}" ]; then
          POLICY_FLAG="--policy ${{ inputs.policy }}"
        fi
        # Single run with --json for machine-readable output
        FITCHECK_EXIT=0
        fitcheck ${{ inputs.command }} --fail-on ${{ inputs.fail-on }} $POLICY_FLAG --json --quiet > /tmp/fitcheck_output.json 2>/dev/null || FITCHECK_EXIT=$?
        echo "exit-code=${FITCHHECK_EXIT}" >> "$GITHUB_OUTPUT"
        # Extract verdict from JSON output if present
        VERDICT=$(python3 -c "import sys,json; d=json.load(open('/tmp/fitcheck_output.json')); print(d.get('verdict','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
        echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
        exit ${FITCHHECK_EXIT}
      shell: bash
      env:
        FITCHECK_SECRET_KEY: ${{ inputs.secret-key }}
    - name: Upload FitCheck report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fitcheck-report
        path: |
          fitcheck_report.html
          fitcheck_decision_*.html
          fitcheck_reports/
        retention-days: 30
